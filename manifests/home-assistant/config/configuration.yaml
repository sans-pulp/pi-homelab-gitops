# Home Assistant core config. Kept in Git, so: no secrets and no home location here.
# Name, location, time zone and units are set in the UI at onboarding (Settings → System → General).

default_config:

homeassistant:
  packages: !include_dir_named packages     # packages/*.yaml: one file per feature

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/homelab-fonts.js               # loads IBM Plex for the Graphite theme

lovelace:
  dashboards:
    home-live:
      mode: yaml
      filename: dashboards/home.yaml
      title: Home
      icon: mdi:home-outline
      show_in_sidebar: true

recorder:
  purge_keep_days: 14
  exclude:
    entities:
      - sensor.tv_home_feed                 # rebuilt every minute; no history needed

# http:                                     # Lab 07: when the Tailscale operator proxies HA, add
#   use_x_forwarded_for: true
#   trusted_proxies: [<pod CIDR>]
